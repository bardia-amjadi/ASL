name: Build debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check tools for runtime asset preparation
        timeout-minutes: 2
        run: |
          for t in patchelf readelf xz gzip dpkg-deb curl python3 sha256sum; do
            command -v "$t" >/dev/null || { echo "Missing tool: $t"; exit 1; }
          done

      - name: Fetch and verify runtime assets
        timeout-minutes: 10
        run: bash scripts/fetch-runtime-assets.sh

      # Caching only. Gradle itself comes from the committed wrapper.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        timeout-minutes: 10

      - name: Check Gradle wrapper files
        run: |
          for f in gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            [ -f "$f" ] || { echo "Missing $f: commit the files from the gradle-wrapper-files artifact"; exit 1; }
          done
          chmod +x gradlew

      - name: Build debug APK
        timeout-minutes: 20
        run: ./gradlew assembleDebug --stacktrace

      - name: Show APK contents (native libs and assets)
        run: |
          ls -l app/build/outputs/apk/debug/
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/|assets/rootfs/" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: asl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
