name: Build debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check tools for runtime asset preparation
        timeout-minutes: 2
        run: |
          for t in patchelf readelf xz gzip dpkg-deb curl python3 sha256sum tar od stat; do
            command -v "$t" >/dev/null || { echo "Missing tool: $t"; exit 1; }
          done

      # PRoot + libraries (Termux repo) and the Alpine test rootfs, SHA-256 verified.
      - name: Fetch and verify runtime assets
        timeout-minutes: 10
        run: bash scripts/fetch-runtime-assets.sh

      # Pins the Debian rootfs (reviewed commit + SHA-256) that the app will download on the phone.
      - name: Resolve Debian manifests (Debian 13 and 12)
        timeout-minutes: 15
        run: bash scripts/resolve-debian.sh

      # Ubuntu Base 24.04 from the official Ubuntu image server; GPG verification is best effort and reported.
      - name: Resolve Ubuntu manifest
        timeout-minutes: 10
        run: bash scripts/resolve-ubuntu.sh

      # The native PTY helper needs an NDK and CMake. Use the ones already installed on the runner so Gradle
      # does not download a large NDK.
      - name: Pick installed NDK and CMake
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -f "$ANDROID_NDK_LATEST_HOME/source.properties" ]; then
            echo "ASL_NDK_VERSION=$(sed -n 's/^Pkg.Revision *= *//p' "$ANDROID_NDK_LATEST_HOME/source.properties" | tr -d '\r ')" >> "$GITHUB_ENV"
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$SDK" ] && [ -d "$SDK/cmake" ]; then
            v="$(ls "$SDK/cmake" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1 || true)"
            if [ -n "$v" ]; then echo "ASL_CMAKE_VERSION=$v" >> "$GITHUB_ENV"; fi
          fi
          echo "NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-unset}"; ls "$SDK/cmake" 2>/dev/null || true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper (only if not committed)
        timeout-minutes: 10
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle --version
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build debug APK
        timeout-minutes: 20
        run: ./gradlew assembleDebug --stacktrace

      - name: Show APK contents (native libs and assets)
        run: |
          ls -l app/build/outputs/apk/debug/
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/|assets/(rootfs|distro)/" || true
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libaslpty || echo "WARNING: libaslpty.so not packaged"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: asl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload generated Gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: warn

      # After the APK is uploaded, so a failing unit test never hides the APK.
      - name: Unit tests (terminal emulator)
        timeout-minutes: 10
        run: ./gradlew testDebugUnitTest --stacktrace
